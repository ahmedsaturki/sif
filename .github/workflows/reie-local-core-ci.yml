name: REIE Local Core CI

on:
  push:
    branches:
      - "feat/reie-local-core-1.0.0"
      - "feat/reie-ingestion-adapter-1.1.0"
  pull_request:
    branches:
      - "feat/sif-adoption-layer-1.0.0"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reie-local-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reie:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"

      - name: Install and verify frozen SIF Core
        working-directory: packages/sif-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test

      - name: Build SIF Adoption
        run: |
          ./packages/sif-core/node_modules/.bin/tsc -p integrations/sif-adoption/tsconfig.json

      - name: Test SIF Adoption
        run: |
          node --experimental-strip-types --test integrations/sif-adoption/test/*.test.ts

      - name: Build REIE Local Core
        run: |
          ./packages/sif-core/node_modules/.bin/tsc -p integrations/lara-os-reie-runtime/tsconfig.json

      - name: Test REIE Local Core
        run: |
          node --experimental-strip-types --test integrations/lara-os-reie-runtime/test/*.test.ts

      - name: REIE CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          node integrations/lara-os-reie-runtime/dist/cli.js init "$tmp/events.jsonl"
          node integrations/lara-os-reie-runtime/dist/cli.js demo "$tmp/events.jsonl"
          node integrations/lara-os-reie-runtime/dist/cli.js health "$tmp/events.jsonl"
          cat > "$tmp/input.json" <<'JSON'
          {
            "records": [
              {
                "entityId": "demo-property-1",
                "entityType": "property",
                "canonicalName": "Galaxy Mall",
                "location": "Sadat City",
                "claims": [
                  { "field": "propertyType", "value": "mall" },
                  { "field": "price.amount", "value": 2500000 }
                ]
              }
            ]
          }
          JSON
          node integrations/lara-os-reie-runtime/dist/cli.js ingest "$tmp/events.jsonl" "$tmp/input.json" "cli-source-1"
          node integrations/lara-os-reie-runtime/dist/cli.js query "$tmp/events.jsonl" "Galaxy Sadat"
          node integrations/lara-os-reie-runtime/dist/cli.js opportunities "$tmp/events.jsonl"
