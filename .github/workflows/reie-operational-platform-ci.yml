name: REIE Operational Platform CI

on:
  push:
    branches:
      - "feat/reie-operational-platform-2.0.0"
  pull_request:
    branches:
      - "feat/sif-adoption-layer-1.0.0"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reie-operational-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-operational-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Install and verify frozen SIF Core
        working-directory: packages/sif-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test

      - name: Build SIF Adoption
        run: ./packages/sif-core/node_modules/.bin/tsc -p integrations/sif-adoption/tsconfig.json

      - name: Test SIF Adoption
        run: node --experimental-strip-types --test integrations/sif-adoption/test/*.test.ts

      - name: Build REIE Local Core
        run: ./packages/sif-core/node_modules/.bin/tsc -p integrations/lara-os-reie-runtime/tsconfig.json

      - name: Test REIE Operational Platform
        run: node --experimental-strip-types --test integrations/lara-os-reie-runtime/test/*.test.ts

      - name: Install optional browser worker dependencies
        working-directory: integrations/lara-os-reie-browser-worker
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Chromium for browser worker smoke test
        working-directory: integrations/lara-os-reie-browser-worker
        run: npx playwright install --with-deps chromium

      - name: Build browser worker
        working-directory: integrations/lara-os-reie-browser-worker
        run: npm run build

      - name: Test browser worker safety boundaries
        working-directory: integrations/lara-os-reie-browser-worker
        run: node --experimental-strip-types --test test/*.test.ts
