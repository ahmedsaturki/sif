name: REIE PostgreSQL Adapter CI

on:
  push:
    branches:
      - "feat/reie-operational-platform-2.0.0"
  pull_request:
    branches:
      - "feat/sif-adoption-layer-1.0.0"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reie-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reie-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reie
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reie"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      REIE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reie
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Install PostgreSQL adapter dependencies
        working-directory: integrations/lara-os-reie-postgres
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build PostgreSQL adapter
        working-directory: integrations/lara-os-reie-postgres
        run: npm run build

      - name: Test live PostgreSQL adapter
        working-directory: integrations/lara-os-reie-postgres
        run: node --test test/store.test.ts
