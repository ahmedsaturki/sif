name: SIF Core CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preserved source archive encoding
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/sif-core/0.5.0
          expected_b64=$(awk '$1 !~ /^#/ && $2 == "sif-core-0.5.0-source.zip.b64" {print $1; exit}' SHA256SUMS)
          test -n "$expected_b64"
          printf '%s  %s\n' "$expected_b64" sif-core-0.5.0-source.zip.b64 | sha256sum -c -
      - name: Decode and verify preserved source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/sif-core/0.5.0
          base64 -d sif-core-0.5.0-source.zip.b64 > sif-core-0.5.0-source.zip
          expected_zip=$(awk '$1 !~ /^#/ && $2 == "decoded:sif-core-0.5.0-source.zip" {print $1; exit}' SHA256SUMS)
          test -n "$expected_zip"
          printf '%s  %s\n' "$expected_zip" sif-core-0.5.0-source.zip | sha256sum -c -
      - name: Extract exact preserved source/test tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci
          mkdir -p .ci
          unzip -q artifacts/sif-core/0.5.0/sif-core-0.5.0-source.zip -d .ci
      - name: Build and test exact preserved tree
        working-directory: .ci/sif-core-0.5.0
        run: npm test
