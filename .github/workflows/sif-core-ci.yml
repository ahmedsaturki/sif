name: SIF Core CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'fix/**', 'refactor/**', 'release/**']
  pull_request:
    branches: [main, 'feat/sif-core-1.0.0-knowledge-semantic']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sif-core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      RUN_POSTGRES_INTEGRATION: '1'
      CANDIDATE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Install deterministic build toolchain
        working-directory: packages/sif-core
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic TypeScript compiler
        working-directory: packages/sif-core
        shell: bash
        run: npx --no-install tsc --version
      - name: Verify artifact identity manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^3f728ac799be5714efdbbddb80fae98152a3767f339f29ee84750ec1c2687bd5  sif-core-0.5.0-source.zip$' artifacts/sif-core/0.5.0/SHA256SUMS
          grep -Eq '^c1b6d297ebef82523d4e1abc0249497fa702f3bd68bd6fa25d839402cc122abc  sif-core-0.5.0.tgz$' artifacts/sif-core/0.5.0/SHA256SUMS
          grep -Fq '/SIF/0.5.0/sif-core-0.5.0-source.zip' artifacts/sif-core/0.5.0/ARCHIVE_PRESERVATION.md
          grep -Fq '/SIF/0.5.0/sif-core-0.5.0.tgz' artifacts/sif-core/0.5.0/ARCHIVE_PRESERVATION.md
      - name: Build and test committed SIF Core tree
        working-directory: packages/sif-core
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/sif-core-test.log"
      - name: Upload temporary test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sif-core-temporary-test-diagnostics-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/sif-core-test.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Prepare PostgreSQL schema
        working-directory: packages/sif-core
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y postgresql-client; }
          psql -v ON_ERROR_STOP=1 -f sql/postgres-schema.sql
      - name: Run live PostgreSQL integration
        working-directory: packages/sif-core
        run: node integration/postgres-live.test.mjs
      - name: Run federated inbox crash-window characterization
        working-directory: packages/sif-core
        run: node integration/federation-inbox-crash-window.test.mjs
      - name: Run PostgreSQL crash-window characterization
        working-directory: packages/sif-core
        shell: bash
        run: bash integration/postgres-crash-window.sh
      - name: Build unpublished candidate archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sif-candidate"
          mkdir -p "$RUNNER_TEMP/sif-candidate"
          git archive --format=zip --prefix=sif-core-source/ HEAD -- packages/sif-core > "$RUNNER_TEMP/sif-candidate/sif-core-source.zip"
          npm pack --pack-destination "$RUNNER_TEMP/sif-candidate" ./packages/sif-core
          test -f "$RUNNER_TEMP/sif-candidate/sif-core-0.5.0.tgz"
          printf 'commit=%s\n' "$CANDIDATE_COMMIT" > "$RUNNER_TEMP/sif-candidate/MANIFEST.txt"
          node -e "const p=require('./packages/sif-core/package.json'); if(p.name!=='sif-core'||p.version!=='0.5.0') process.exit(1); console.log('package='+p.name+'@'+p.version)" >> "$RUNNER_TEMP/sif-candidate/MANIFEST.txt"
          sha256sum "$RUNNER_TEMP/sif-candidate/sif-core-source.zip" "$RUNNER_TEMP/sif-candidate/sif-core-0.5.0.tgz" >> "$RUNNER_TEMP/sif-candidate/MANIFEST.txt"
      - name: Verify unpublished candidate archives
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sif-candidate"
          unzip -t sif-core-source.zip >/dev/null
          tar -tzf sif-core-0.5.0.tgz > tarball-list.txt
          unzip -l sif-core-source.zip > source-list.txt
          grep -Fq 'packages/sif-core/package.json' source-list.txt
          grep -Fq 'packages/sif-core/src/' source-list.txt
          grep -Fq 'packages/sif-core/test/' source-list.txt
          grep -Fq 'packages/sif-core/sql/' source-list.txt
          grep -Fxq 'package/LICENSE' tarball-list.txt
          grep -Fxq 'package/dist/src/index.js' tarball-list.txt
          grep -Fxq 'package/dist/src/index.d.ts' tarball-list.txt
          grep -Fxq 'package/sql/postgres-schema.sql' tarball-list.txt
          tar -xOf sif-core-0.5.0.tgz package/package.json > package.json.extracted
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('./package.json.extracted','utf8')); if(p.name!=='sif-core'||p.version!=='0.5.0'||p.exports?.['.']?.import!=='./dist/src/index.js'||p.types!=='./dist/src/index.d.ts') process.exit(1); console.log('verified '+p.name+'@'+p.version+' package entrypoints')"
          rm -rf "$RUNNER_TEMP/sif-consumer"
          mkdir -p "$RUNNER_TEMP/sif-consumer"
          printf '{"type":"module"}\n' > "$RUNNER_TEMP/sif-consumer/package.json"
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/sif-candidate/sif-core-0.5.0.tgz" --prefix "$RUNNER_TEMP/sif-consumer"
          cd "$RUNNER_TEMP/sif-consumer"
          node --input-type=module -e "import('sif-core').then(m=>{if(typeof m.SifEventWriter!=='function'||typeof m.InMemoryEventStore!=='function'||typeof m.digest!=='function') process.exit(1); console.log('packed package import smoke test passed')})"
          cd "$RUNNER_TEMP/sif-candidate"
          awk '$1 ~ /^[0-9a-f]{64}$/ {print $1"  "$2}' MANIFEST.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -c < sif-core-source.zip)" -gt 0
          test "$(wc -c < sif-core-0.5.0.tgz)" -gt 0
          grep -Fx "commit=$CANDIDATE_COMMIT" MANIFEST.txt
      - name: Upload unpublished candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sif-core-unpublished-candidate-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/sif-candidate
          if-no-files-found: error
          retention-days: 14
